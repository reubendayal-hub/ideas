<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reuben Dayal — Shared Pages</title>
<style>
  :root {
    --navy: #1e2f4a; --gold: #b89a6a; --golddk: #9a7d4f;
    --cream: #f9f6f2; --text: #2a2a2a; --muted: #767676;
    --bg: #f0ece6; --card: #ffffff; --border: #e4ddd3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181f; --card: #1c2129; --text: #e8e6e1; --muted: #9aa0aa; --border: #2a2f38;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181f; --card: #1c2129; --text: #e8e6e1; --muted: #9aa0aa; --border: #2a2f38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px 60px; }
  .eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--golddk); font-weight: 700; margin-bottom: 8px; }
  h1 { font-size: 26px; margin: 0 0 10px; color: var(--navy); }
  :root[data-theme="dark"] h1 { color: #d9c491; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) h1 { color: #d9c491; } }
  .sub { color: var(--muted); font-size: 14.5px; margin: 0 0 28px; line-height: 1.5; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item {
    display: block; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px; text-decoration: none; color: var(--text);
  }
  .item .title { font-weight: 700; font-size: 15.5px; color: var(--navy); }
  :root[data-theme="dark"] .item .title { color: #cdd9f0; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .item .title { color: #cdd9f0; } }
  .item .desc { font-size: 13px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Reuben Dayal</div>
  <h1>Shared Pages</h1>
  <p class="sub">Reference pages shared for review — cricket club, side projects, and one-off comparisons.</p>
  <div class="list">
    <a class="item" href="/fcc-shed-options">
      <div class="title">FCC Shed Options — Karlebo Cricket Ground</div>
      <div class="desc">Comparing ready-made shed kits against the kommune-approved design.</div>
    </a>
  </div>
</div>
</body>
</html>
