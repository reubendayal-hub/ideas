<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Reuben Dayal</title>
<style>
  :root {
    --navy: #1e2f4a; --gold: #b89a6a; --golddk: #9a7d4f;
    --cream: #f9f6f2; --text: #2a2a2a; --muted: #767676;
    --bg: #f9f6f2; --card: #ffffff; --border: #e4ddd3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Newsreader', Georgia, serif; -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px 60px; }
  .eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--golddk); font-weight: 700; margin-bottom: 8px; }
  h1 { font-size: 26px; margin: 0 0 10px; color: var(--navy); }
  .sub { color: var(--muted); font-size: 14.5px; margin: 0 0 28px; line-height: 1.5; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item {
    display: block; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px; text-decoration: none; color: var(--text);
  }
  .item .title { font-weight: 700; font-size: 15.5px; color: var(--navy); }
  .item .desc { font-size: 13px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Reuben Dayal</div>
  <h1>Private pages</h1>
  <p class="sub">Pages here are shared privately by link.<br>If someone sent you one, open the link they gave you.</p>
</div>
</body>
</html>
